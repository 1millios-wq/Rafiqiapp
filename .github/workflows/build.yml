name: Build Rafiqi APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Fix Manifest Namespaces
        run: |
          A="http://schemas."
          B="://android.com"
          C="://android.com"
          sed -i "s|http://android.com|${A}${B}|g" app/src/main/AndroidManifest.xml
          sed -i "s|xmlns:tools=\"${A}${B}\"|xmlns:tools=\"${A}${C}\"|g" app/src/main/AndroidManifest.xml
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Rafiqi-APK
          path: app/build/outputs/apk/debug/app-debug.apk
